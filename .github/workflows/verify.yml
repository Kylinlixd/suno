name: Verify

on:
  push:
    branches: [main]
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 25
          cache: maven
      # 无 Docker 的 CI 环境：跳过 Testcontainers 集成测试，运行 H2 全量单元/契约门禁
      - name: Maven verify (H2, skip ITs)
        run: ./mvnw --batch-mode --no-transfer-progress -DskipITs verify
      - name: Documentation gates
        run: |
          ./scripts/verify-docs.sh
          ./scripts/verify-repository.sh
