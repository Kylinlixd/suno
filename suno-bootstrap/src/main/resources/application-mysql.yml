spring:
  datasource:
    url: jdbc:mysql://localhost:3306/suno_mall?useSSL=false&serverTimezone=UTC&connectionTimeZone=UTC&forceConnectionTimeZoneToSession=true&characterEncoding=utf8&tinyInt1IsBit=false
    # Required external credentials: unresolved placeholders fail startup for this non-dev profile.
    username: ${SUNO_DB_USERNAME}
    password: ${SUNO_DB_PASSWORD}
    driver-class-name: com.mysql.cj.jdbc.Driver
  jpa:
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  sql:
    init:
      mode: never
  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true
    baseline-version: 0
