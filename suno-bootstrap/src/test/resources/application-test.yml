spring:
  datasource:
    url: jdbc:h2:mem:suno_mall_test;MODE=MySQL;DATABASE_TO_LOWER=TRUE;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
    username: sa
    password:
    driver-class-name: org.h2.Driver
  jpa:
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  sql:
    init:
      mode: never
  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true
    baseline-version: 0
  task:
    scheduling:
      enabled: false

payment:
  callback:
    secret: test-payment-callback-secret

security:
  auth:
    jwt:
      secret: test-only-jwt-secret-that-is-not-for-production
